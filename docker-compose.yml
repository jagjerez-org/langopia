services:
  postgres:
    image: postgres:16-alpine
    container_name: langopia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langopia
      POSTGRES_PASSWORD: langopia
      POSTGRES_DB: langopia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: langopia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  livekit:
    image: livekit/livekit-server
    container_name: langopia-livekit
    restart: unless-stopped
    command: --dev --config /etc/livekit.yaml --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882-7892:7882-7892/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis

  minio:
    image: minio/minio
    container_name: langopia-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: langopia
      MINIO_ROOT_PASSWORD: langopia123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    container_name: langopia-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 langopia langopia123;
      mc mb --ignore-existing local/langopia-recordings;
      mc anonymous set download local/langopia-recordings;
      exit 0;
      "

  egress:
    image: livekit/egress
    container_name: langopia-egress
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_STRING: |
        api_key: devkey
        api_secret: secret
        ws_url: ws://livekit:7880
        s3:
          access_key: langopia
          secret: langopia123
          region: us-east-1
          endpoint: http://minio:9000
          bucket: langopia-recordings
          force_path_style: true
    depends_on:
      - livekit
      - minio

volumes:
  pgdata:
  redisdata:
  miniodata:
