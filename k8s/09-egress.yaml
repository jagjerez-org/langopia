apiVersion: apps/v1
kind: Deployment
metadata:
  name: egress
  namespace: langopia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egress
  template:
    metadata:
      labels:
        app: egress
    spec:
      containers:
      - name: egress
        image: livekit/egress
        env:
        - name: EGRESS_CONFIG_STRING
          value: |
            api_key: devkey
            api_secret: secret
            ws_url: ws://livekit-service:7880
            s3:
              access_key: langopia
              secret: langopia123
              region: us-east-1
              endpoint: http://minio-service:9000
              bucket: langopia-recordings
              force_path_style: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"