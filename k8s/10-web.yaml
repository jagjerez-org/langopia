apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: langopia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: docker.io/library/langopia-web:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: REDIS_URL
        - name: LIVEKIT_API_KEY
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: LIVEKIT_API_KEY
        - name: LIVEKIT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: LIVEKIT_API_SECRET
        - name: NEXT_PUBLIC_LIVEKIT_URL
          value: "ws://192.168.0.17:7880"
        - name: NEXTAUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: NEXTAUTH_SECRET
        - name: NEXTAUTH_URL
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: NEXTAUTH_URL
        - name: S3_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: S3_ENDPOINT
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: S3_SECRET_KEY
        - name: S3_BUCKET
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: S3_BUCKET
        - name: S3_REGION
          value: "us-east-1"
        - name: AUTH_TRUST_HOST
          value: "true"
        - name: AUTH_URL
          valueFrom:
            secretKeyRef:
              name: langopia-secrets
              key: AUTH_URL
        - name: NODE_ENV
          value: "development"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: web-service
  namespace: langopia
spec:
  selector:
    app: web
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP