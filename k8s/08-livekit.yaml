apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
  namespace: langopia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: livekit
        image: livekit/livekit-server
        args:
        - "--dev"
        - "--config"
        - "/etc/livekit.yaml"
        - "--bind"
        - "0.0.0.0"
        ports:
        - containerPort: 7880
          protocol: TCP
        - containerPort: 7881
          protocol: TCP
        - containerPort: 7882
          protocol: UDP
        - containerPort: 7883
          protocol: UDP
        - containerPort: 7884
          protocol: UDP
        - containerPort: 7885
          protocol: UDP
        - containerPort: 7886
          protocol: UDP
        - containerPort: 7887
          protocol: UDP
        - containerPort: 7888
          protocol: UDP
        - containerPort: 7889
          protocol: UDP
        - containerPort: 7890
          protocol: UDP
        - containerPort: 7891
          protocol: UDP
        - containerPort: 7892
          protocol: UDP
        volumeMounts:
        - name: livekit-config
          mountPath: /etc/livekit.yaml
          subPath: livekit.yaml
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
      volumes:
      - name: livekit-config
        configMap:
          name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit-service
  namespace: langopia
spec:
  selector:
    app: livekit
  ports:
  - name: websocket
    port: 7880
    targetPort: 7880
    protocol: TCP
  - name: turn
    port: 7881
    targetPort: 7881
    protocol: TCP