apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
  namespace: langopia
data:
  livekit.yaml: |
    port: 7880
    rtc:
      port_range_start: 7882
      port_range_end: 7892
      use_external_ip: false
    redis:
      address: redis-service:6379
    keys:
      devkey: secret
    logging:
      level: info