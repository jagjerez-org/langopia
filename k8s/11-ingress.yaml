apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: langopia-ingress
  namespace: langopia
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-service
            port:
              number: 3000
