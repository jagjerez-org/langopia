<svg xmlns="http://www.w3.org/2000/svg" width="260" height="32" viewBox="0 0 260 32" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8755a"/>
      <stop offset="50%" stop-color="#d4547a"/>
      <stop offset="100%" stop-color="#b44fa0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c4587a"/>
      <stop offset="50%" stop-color="#9a6aaf"/>
      <stop offset="100%" stop-color="#7a7fc4"/>
    </linearGradient>
  </defs>
  <!-- "by" text -->
  <text x="8" y="20.5" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="300" fill="#a1a1aa">by</text>
  <!-- Stylized "A" logo mark -->
  <text x="26" y="22" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="url(#logoGrad)">A</text>
  <!-- Academy name text -->
  <text x="42" y="20.5" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="600" letter-spacing="2" fill="url(#textGrad)">AMERICAN LANGUAGE ACADEMY</text>
</svg>
