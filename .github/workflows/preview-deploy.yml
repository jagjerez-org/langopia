# .github/workflows/preview-deploy.yml
#
# Despliega un entorno preview aislado por PR.
#
#   - langopia-api se despliega primero. DATABASE_URL para preview se toma del
#     secreto PREVIEW_DATABASE_URL y se inyecta en .vercel/.env.preview.local
#     tras `vercel pull`, sobreescribiendo cualquier valor previo de Vercel.
#     El build de la API ejecuta db:push + db:policies + db:seed cuando
#     VERCEL_ENV == preview.
#   - langopia-app y langopia-sites se despliegan después, apuntando a la URL
#     de la API preview de esta misma PR.
#   - Al cerrar la PR, preview-cleanup.yml se encarga del teardown.
#
# Los despliegues de Vercel se hacen con --prebuilt: GitHub Actions compila en
# el runner y Vercel solo sube el resultado. Esto evita que Vercel vuelva a
# compilar y perda variables generadas dinámicamente (vercel.json de app,
# .env de sites).
#
# Cada job tiene `if: vars.VERCEL_PREVIEW_DEPLOY_ENABLED == 'true'` para que,
# igual que el despliegue a producción en ci.yml, un repo sin la integración
# de preview configurada no falle las PRs por un problema de infraestructura.

name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy-api:
    if: vars.VERCEL_PREVIEW_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    outputs:
      api_url: ${{ steps.deploy.outputs.api_url }}
      api_alias: ${{ steps.deploy.outputs.api_alias }}
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --global vercel@latest

      - name: Desplegar API preview
        id: deploy
        working-directory: apps/api
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
        run: |
          vercel link --yes --project langopia-api --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

          # Sobreescribir DATABASE_URL con el secreto del repo; esto evita que
          # un valor inválido o vacío traído por Vercel rompa db:push/db:seed.
          echo "DATABASE_URL=$PREVIEW_DATABASE_URL" >> .vercel/.env.preview.local

          # La aplicación se conecta con el rol langopia_app (sin BYPASSRLS).
          # Construimos su URL a partir de PREVIEW_DATABASE_URL para que el
          # preview use la misma contraseña que crea db:policies.
          DATABASE_URL_APP=$(echo "$PREVIEW_DATABASE_URL" | sed -E 's|://[^:@]+:[^@]+@|://langopia_app:Lang0p1a!DevApp_2025_Secure@|')
          echo "DATABASE_URL_APP=$DATABASE_URL_APP" >> .vercel/.env.preview.local

          # Secreto para firmar tokens MCP OAuth. En preview generamos uno
          # aleatorio por despliegue; en producción debe ser un secreto estable.
          MCP_OAUTH_TOKEN_SECRET=$(openssl rand -hex 32)
          echo "MCP_OAUTH_TOKEN_SECRET=$MCP_OAUTH_TOKEN_SECRET" >> .vercel/.env.preview.local

          # Better Auth deduce su basePath (/api/v1/auth) de BETTER_AUTH_URL.
          # Sin esto usa /api/auth por defecto y todas las rutas de auth dan 404.
          # Los orígenes de confianza deben incluir el dominio desde el que la
          # app preview enviará el header Origin en sign-in/sign-up.
          API_ALIAS="pr-${PR_NUMBER}.api.langopia.com"
          APP_ALIAS="pr-${PR_NUMBER}.app.langopia.com"
          BETTER_AUTH_URL="https://${API_ALIAS}/api/v1/auth"
          BETTER_AUTH_TRUSTED_ORIGINS="https://${APP_ALIAS}"
          echo "BETTER_AUTH_URL=$BETTER_AUTH_URL" >> .vercel/.env.preview.local
          echo "BETTER_AUTH_TRUSTED_ORIGINS=$BETTER_AUTH_TRUSTED_ORIGINS" >> .vercel/.env.preview.local

          # Ejecutar migraciones, políticas y seed fuera del vercel build para
          # no consumir el timeout de Vercel ni depender de su entorno.
          export DATABASE_URL="$PREVIEW_DATABASE_URL"
          export DATABASE_URL_APP="$DATABASE_URL_APP"
          npm run build --workspace @langopia/contracts
          npm run build --workspace @langopia/db
          npm run db:push --workspace @langopia/db
          npm run db:policies --workspace @langopia/db
          npm run db:seed --workspace @langopia/db

          vercel build --token "$VERCEL_TOKEN"
          API_URL=$(vercel deploy --prebuilt --token "$VERCEL_TOKEN" \
            --env DATABASE_URL_APP="$DATABASE_URL_APP" \
            --env MCP_OAUTH_TOKEN_SECRET="$MCP_OAUTH_TOKEN_SECRET" \
            --env BETTER_AUTH_URL="$BETTER_AUTH_URL" \
            --env BETTER_AUTH_TRUSTED_ORIGINS="$BETTER_AUTH_TRUSTED_ORIGINS")
          vercel alias set "$API_URL" "$API_ALIAS" --token "$VERCEL_TOKEN"
          echo "api_url=$API_URL" >> "$GITHUB_OUTPUT"
          echo "api_alias=$API_ALIAS" >> "$GITHUB_OUTPUT"

  deploy-app:
    if: vars.VERCEL_PREVIEW_DEPLOY_ENABLED == 'true'
    needs: deploy-api
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.deploy.outputs.app_url }}
      app_alias: ${{ steps.deploy.outputs.app_alias }}
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --global vercel@latest

      - name: Configurar vercel.json apuntando a la API preview
        working-directory: apps/app
        env:
          API_URL: ${{ needs.deploy-api.outputs.api_url }}
        run: |
          cat > vercel.json <<EOF
          {
            "\$schema": "https://openapi.vercel.sh/vercel.json",
            "installCommand": "cd ../.. && test -d node_modules/.bin || npm ci",
            "buildCommand": "cd ../.. && npm run build --workspace @langopia/contracts && npm run build --workspace @langopia/app",
            "rewrites": [
              { "source": "/api/:path*", "destination": "${API_URL}/api/:path*" },
              { "source": "/((?!api/).*)", "destination": "/index.html" }
            ]
          }
          EOF

      - name: Desplegar app preview
        id: deploy
        working-directory: apps/app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link --yes --project langopia-app --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
          vercel build --token "$VERCEL_TOKEN"
          APP_URL=$(vercel deploy --prebuilt --token "$VERCEL_TOKEN")
          APP_ALIAS="pr-${PR_NUMBER}.app.langopia.com"
          vercel alias set "$APP_URL" "$APP_ALIAS" --token "$VERCEL_TOKEN"
          echo "app_url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "app_alias=$APP_ALIAS" >> "$GITHUB_OUTPUT"

  deploy-sites:
    if: vars.VERCEL_PREVIEW_DEPLOY_ENABLED == 'true'
    needs: deploy-api
    runs-on: ubuntu-latest
    outputs:
      sites_url: ${{ steps.deploy.outputs.sites_url }}
      sites_alias: ${{ steps.deploy.outputs.sites_alias }}
    env:
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm install --global vercel@latest

      - name: Configurar API_URL para sites
        working-directory: apps/sites
        env:
          API_URL: ${{ needs.deploy-api.outputs.api_url }}
        run: |
          echo "API_URL=$API_URL" > .env

      - name: Desplegar sites preview
        id: deploy
        working-directory: apps/sites
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel link --yes --project langopia-sites --token "$VERCEL_TOKEN"
          vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"
          vercel build --token "$VERCEL_TOKEN"
          SITES_URL=$(vercel deploy --prebuilt --token "$VERCEL_TOKEN")
          SITES_ALIAS="pr-${PR_NUMBER}.sites.langopia.com"
          vercel alias set "$SITES_URL" "$SITES_ALIAS" --token "$VERCEL_TOKEN"
          echo "sites_url=$SITES_URL" >> "$GITHUB_OUTPUT"
          echo "sites_alias=$SITES_ALIAS" >> "$GITHUB_OUTPUT"

  comment:
    if: vars.VERCEL_PREVIEW_DEPLOY_ENABLED == 'true'
    needs: [deploy-api, deploy-app, deploy-sites]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comentar previews en la PR
        uses: thollander/actions-comment-pull-request@v2
        with:
          comment_tag: langopia-preview
          message: |
            🚀 Previews desplegados para esta PR:

            | App | URL Vercel | Alias PR |
            | --- | --- | --- |
            | API | ${{ needs.deploy-api.outputs.api_url }} | https://${{ needs.deploy-api.outputs.api_alias }} |
            | App | ${{ needs.deploy-app.outputs.app_url }} | https://${{ needs.deploy-app.outputs.app_alias }} |
            | Sites | ${{ needs.deploy-sites.outputs.sites_url }} | https://${{ needs.deploy-sites.outputs.sites_alias }} |

            La base de datos es aislada y se ha sembrado con el seed de demo.
