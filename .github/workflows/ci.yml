# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector hace falta desde la migración 0007 (embeddings del material
        # subido): postgres:17-alpine pelado no la trae y db:migrate falla.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: langopia
          POSTGRES_PASSWORD: langopia
          POSTGRES_DB: langopia
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgres://langopia:langopia@localhost:5432/langopia
      DATABASE_URL_APP: postgres://langopia_app:cambiame@localhost:5432/langopia
      # La prueba de extremo a extremo (Tarea 10) arranca el `AppModule`
      # completo, incluido Better Auth (`iam.module.ts` construye `AUTH` con
      # `createAuth(...)`, que sin estas dos lee `undefined` y no puede
      # firmar ni verificar sesiones). Los pasos anteriores nunca las
      # necesitaron: los `*.spec.ts` unitarios jamás construyen el
      # contenedor de Nest. Secreto de CI, no de producción.
      BETTER_AUTH_SECRET: ci-e2e-secret-no-es-de-produccion
      BETTER_AUTH_URL: http://localhost:3000/api/v1/auth

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Playwright (Tarea 13) necesita el navegador descargado aparte de
      # `npm ci`: no viene con el paquete `@playwright/test`.
      - run: npx playwright install --with-deps chromium
      # Los paquetes se consumen compilados (`dist`): sin este paso, el
      # typecheck de la API falla con «Cannot find module '@langopia/...'».
      - run: npm run build --workspace @langopia/contracts
      - run: npm run build --workspace @langopia/db
      - run: npm run typecheck
      - run: npm run typecheck:e2e --workspace @langopia/api
      - run: npm run typecheck:e2e --workspace @langopia/web

      - name: Esquema y políticas de aislamiento
        run: |
          npm run db:migrate
          npm run db:policies

      # El seed comprueba el aislamiento entre escuelas y sale con error si falla.
      - name: Seed y verificación de aislamiento
        run: npm run db:seed

      - name: Pruebas (API)
        run: npm run test --workspace @langopia/api

      # El panel (`apps/web`) tiene su propia batería (formatos, i18n con sus
      # cinco idiomas, componentes, clientes de API...): sin este paso, nunca
      # corría en CI y una regresión ahí pasaría desapercibida para siempre.
      - name: Pruebas (panel web)
        run: npm run test --workspace @langopia/web

      # Tarea 10 de la ola 1, Tarea 13 de la ola 2 y Tarea 11 de la ola 3:
      # criterios de «listo»
      # de la API automatizados. Corren aparte de la batería unitaria de
      # arriba (arrancan el `AppModule` completo contra Postgres real) para
      # no alargar ni acoplar el `npm run test` de siempre.
      - name: Pruebas de extremo a extremo de la API (olas 1, 2 y 3)
        run: npm run test:e2e --workspace @langopia/api

      # `apps/api/dist/main.js` — el recorrido de Playwright de abajo levanta
      # la API compilada como un proceso real, no el `AppModule` en memoria.
      - run: npm run api:build

      # Tarea 13 de la ola 1: el criterio de «listo» del panel ENTERO,
      # automatizado con un navegador real (Chromium) contra la API
      # compilada y este mismo Postgres — registro de escuela, puesta en
      # marcha, alta de profesorado y alumnado (con menor y tutor exigido),
      # importación por CSV, tres clases con dos cancelaciones y una lista de
      # asistencia, facturación con su comisión desglosada, y el portal del
      # alumno viendo solo sus propios datos. Si el panel deja de funcionar
      # de principio a fin, este paso —y solo este— se pone en rojo.
      - name: Recorrido de extremo a extremo del panel (ola 1, Playwright)
        run: npm run test:e2e --workspace @langopia/web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7

  desplegar:
    needs: verificar
    # Variable (no secreto) de repositorio: VERCEL_DEPLOY_ENABLED=true activa
    # el despliegue. Sin ella, el job se salta limpio en vez de fallar por
    # faltar los secretos de Vercel — así un fork o una copia del repo no
    # hereda un job rojo permanente.
    if: github.ref == 'refs/heads/main' && vars.VERCEL_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Rol dueño del esquema en la base de datos de PRODUCCIÓN (Neon). Solo
      # lo usa el paso de migraciones; la aplicación nunca lo ve.
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      # Contraseña del rol de aplicación `langopia_app`. Debe coincidir con
      # la usada en la env var `DATABASE_URL_APP` desplegada en Vercel.
      APP_DATABASE_PASSWORD: ${{ secrets.PROD_DATABASE_URL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Las migraciones y las políticas RLS corren AQUÍ y no al arrancar la
      # API: en serverless no hay arranque del proceso donde correrlas (en
      # Railway las hacía `start:prod` antes del `listen`). Primero el
      # esquema, luego el despliegue — nunca sirve código que pida columnas
      # que todavía no existen.
      - name: Migraciones y políticas (producción)
        run: npm run db:deploy

      # Un proyecto de Vercel por app (langopia-api, langopia-web,
      # langopia-sites), cada uno con su Root Directory. `vercel build`
      # compila en el runner (los buildCommand de cada vercel.json suben a la
      # raíz del monorepo para construir los paquetes workspace) y
      # `deploy --prebuilt` sube el resultado: Vercel no necesita acceso al
      # repo ni volver a compilar.
      - name: Desplegar los tres proyectos en Vercel
        run: |
          npm install --global vercel@latest
          for app in api web sites; do
            (
              cd "apps/$app"
              vercel link --yes --project "langopia-$app" --token "$VERCEL_TOKEN"
              vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
              vercel build --prod --token "$VERCEL_TOKEN"
              vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
            )
          done
